<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1010" viewBox="0 0 430 1010" role="img" aria-labelledby="title description">
  <title id="title">Button Actions dashboard mobile mockup</title>
  <desc id="description">Illustrative mobile layout of the Button Actions Home Assistant dashboard with summary cards, remote status, timing, and button gestures.</desc>
  <defs>
